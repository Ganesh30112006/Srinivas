name: Deploy

# After CI passes on main, the server pulls main and runs infra/ec2/deploy.sh (backup,
# migrations, frontend build, rolling restart, health check). GitHub logs in to AWS with OIDC:
# no AWS keys are stored in GitHub. Repository variables (Settings > Secrets and variables >
# Actions > Variables): AWS_REGION, AWS_DEPLOY_ROLE_ARN, SMARTCLASS_INSTANCE_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      INSTANCE_ID: ${{ vars.SMARTCLASS_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Is the server running?
        id: state
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "running" ]; then
            echo "::notice::Server is $state; skipping. Starting it with infra/aws/server.ps1 deploys the latest main."
          fi

      - name: Deploy over SSM
        if: steps.state.outputs.state == 'running'
        run: |
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 1800 \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["set -eu","cd /opt/smartclass-src","git fetch --quiet origin main","git checkout -q -B main origin/main","bash infra/ec2/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "SSM command $cmd"
          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -40
          echo "Status: $status"
          [ "$status" = "Success" ] || {
            aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -40
            exit 1
          }
